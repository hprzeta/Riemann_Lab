<svg width="100%" viewBox="0 0 680 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Riemann Lab Header</title>
<desc>En-tête Riemann Lab avec zéta à gauche et zéros non-triviaux</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="680" height="420" fill="#0d0d0d"/>

<!-- ζ grand à gauche -->
<text x="95" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="220" font-weight="bold" fill="#c9a84c" opacity="0.18">ζ</text>
<text x="95" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="220" font-weight="bold" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.55">ζ</text>

<!-- Droite critique -->
<line x1="370" y1="30" x2="370" y2="330" stroke="#c9a84c" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>
<text x="370" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#c9a84c" opacity="0.7" letter-spacing="2">Re(s) = ½</text>

<!-- Axes -->
<line x1="200" y1="200" x2="630" y2="200" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="370" y1="340" x2="370" y2="20" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>

<text x="638" y="204" font-family="Georgia, serif" font-size="13" fill="#666">Re</text>
<text x="378" y="18" font-family="Georgia, serif" font-size="13" fill="#666">Im</text>

<!-- Bandes 0 et 1 -->
<line x1="230" y1="30" x2="230" y2="330" stroke="#c9a84c" stroke-width="0.4" opacity="0.15"/>
<line x1="510" y1="30" x2="510" y2="330" stroke="#c9a84c" stroke-width="0.4" opacity="0.15"/>
<text x="230" y="214" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#555">0</text>
<text x="510" y="214" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#555">1</text>
<text x="364" y="214" text-anchor="end" font-family="Georgia, serif" font-size="11" fill="#666">½</text>

<!-- Zéros -->
<circle cx="370" cy="110" r="7" fill="#c9a84c" opacity="0.95"/>
<text x="388" y="114" font-family="Georgia, serif" font-size="13" fill="#e8d5a0">γ₁ = 14.13</text>

<circle cx="370" cy="148" r="7" fill="#c9a84c" opacity="0.95"/>
<text x="388" y="152" font-family="Georgia, serif" font-size="13" fill="#e8d5a0">γ₂ = 21.02</text>

<circle cx="370" cy="178" r="7" fill="#c9a84c" opacity="0.95"/>
<text x="388" y="182" font-family="Georgia, serif" font-size="13" fill="#e8d5a0">γ₃ = 25.01</text>

<circle cx="370" cy="222" r="7" fill="#c9a84c" opacity="0.95"/>
<text x="388" y="226" font-family="Georgia, serif" font-size="13" fill="#e8d5a0">γ₄ = 30.42</text>

<circle cx="370" cy="258" r="7" fill="#c9a84c" opacity="0.95"/>
<text x="388" y="262" font-family="Georgia, serif" font-size="13" fill="#e8d5a0">γ₅ = 32.93</text>

<circle cx="370" cy="290" r="7" fill="#c9a84c" opacity="0.95"/>
<text x="388" y="294" font-family="Georgia, serif" font-size="13" fill="#e8d5a0">γ₆ = 37.58</text>

<!-- Courbe Z(t) -->
<path d="M 210 200 Q 230 175 250 200 Q 270 225 290 200 Q 310 168 330 200 Q 345 220 355 200" stroke="#4a7fa5" stroke-width="1.5" fill="none" opacity="0.5"/>

<!-- Séparateur -->
<line x1="0" y1="345" x2="680" y2="345" stroke="#c9a84c" stroke-width="0.5" opacity="0.3"/>

<!-- Bande basse -->
<rect x="0" y="345" width="680" height="75" fill="#0a0a0a"/>
<text x="370" y="383" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="normal" fill="#ffffff" letter-spacing="6">RIEMANN</text>
<text x="370" y="415" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="normal" fill="#c9a84c" letter-spacing="12">LAB</text>
<text x="370" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#aaaaaa" letter-spacing="1">hprzeta · Hypothèse de Riemann</text>

</svg>
