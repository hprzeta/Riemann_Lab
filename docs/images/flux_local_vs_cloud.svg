<svg width="100%" viewBox="0 0 680 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Flux : ce qui est 100% local (mathstral/RAG) vs ce qui passe par le cloud (Claude Code)</title>
<desc>La machine PC1 en local (Claude Code, Ollama, mathstral, vault RAG, GPU/RAM) et le cloud Anthropic que seul Claude Code contacte. mathstral ne touche jamais le cloud.</desc>
<style>
  .t  { font-family: sans-serif; font-size: 14px; fill: #2C2C2A; }
  .th { font-family: sans-serif; font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-family: sans-serif; font-size: 12px; fill: #5F5E5A; }
  .zone-local  { fill: #E1F5EE; stroke: #0F6E56; }
  .box-blue    { fill: #E6F1FB; stroke: #185FA5; }
  .box-purple  { fill: #EEEDFE; stroke: #534AB7; }
  .box-gray    { fill: #F1EFE8; stroke: #5F5E5A; }
  .box-amber   { fill: #FAEEDA; stroke: #854F0B; }
  .lbl-blue   { fill: #0C447C; } .lbl-blue-s   { fill: #185FA5; }
  .lbl-purple { fill: #3C3489; } .lbl-purple-s { fill: #534AB7; }
  .lbl-gray   { fill: #2C2C2A; } .lbl-gray-s   { fill: #5F5E5A; }
  .lbl-amber  { fill: #633806; } .lbl-amber-s  { fill: #854F0B; }
  .lbl-teal   { fill: #085041; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="zone-local" x="30" y="40" width="420" height="350" rx="20" stroke-width="0.5"/>
<text class="th lbl-teal" x="52" y="68">Ta machine PC1 (zeta-lab) — 100% local</text>

<rect class="box-blue" x="60" y="90" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th lbl-blue" x="145" y="112" text-anchor="middle">Claude Code</text>
<text class="ts lbl-blue-s" x="145" y="130" text-anchor="middle">agent qui tape</text>

<rect class="box-purple" x="60" y="200" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th lbl-purple" x="145" y="222" text-anchor="middle">Ollama + mathstral</text>
<text class="ts lbl-purple-s" x="145" y="240" text-anchor="middle">génère les réponses</text>

<rect class="box-purple" x="60" y="310" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th lbl-purple" x="145" y="332" text-anchor="middle">Vault RAG</text>
<text class="ts lbl-purple-s" x="145" y="350" text-anchor="middle">ChromaDB + embedding</text>

<rect class="box-gray" x="280" y="200" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th lbl-gray" x="355" y="222" text-anchor="middle">GPU + RAM</text>
<text class="ts lbl-gray-s" x="355" y="240" text-anchor="middle">VRAM 3,3 Go</text>

<line x1="145" y1="146" x2="145" y2="198" class="arr" marker-end="url(#arrow)"/>
<line x1="145" y1="256" x2="145" y2="308" class="arr" marker-end="url(#arrow)"/>
<line x1="230" y1="228" x2="278" y2="228" class="arr" marker-end="url(#arrow)"/>

<rect class="box-amber" x="490" y="90" width="160" height="90" rx="20" stroke-width="0.5"/>
<text class="th lbl-amber" x="570" y="122" text-anchor="middle">Cloud Anthropic</text>
<text class="ts lbl-amber-s" x="570" y="142" text-anchor="middle">cerveau de Claude Code</text>
<text class="ts lbl-amber-s" x="570" y="160" text-anchor="middle">(erreur 529 = ici)</text>

<line x1="230" y1="112" x2="488" y2="120" stroke="#BA7517" stroke-width="1.5" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text class="ts lbl-gray-s" x="360" y="100" text-anchor="middle">internet</text>

<text class="ts lbl-gray-s" x="240" y="405" text-anchor="middle">Seul Claude Code sort vers le cloud — mathstral, RAG et GPU restent 100% locaux</text>
</svg>
