<svg width="100%" viewBox="0 0 680 320" role="img">
<title>Logo Riemann Lab</title>
<desc>Logo animé du projet Riemann Lab</desc>
<defs>
<style>
@keyframes pulse { 0%,100%{opacity:1;r:5} 50%{opacity:0.4;r:3} }
@keyframes glow { 0%,100%{opacity:0.8} 50%{opacity:0.3} }
@keyframes drift { 0%{stroke-dashoffset:0} 100%{stroke-dashoffset:-40} }
.z1{animation:pulse 2.1s ease-in-out infinite}
.z2{animation:pulse 2.7s ease-in-out infinite 0.4s}
.z3{animation:pulse 1.9s ease-in-out infinite 0.8s}
.z4{animation:pulse 2.4s ease-in-out infinite 1.2s}
.z5{animation:pulse 2.2s ease-in-out infinite 1.6s}
.z6{animation:pulse 2.6s ease-in-out infinite 0.2s}
.crit{stroke-dasharray:6 4;animation:drift 2s linear infinite}
</style>
</defs>
<rect width="680" height="320" fill="#0d1117" rx="12"/>
<line x1="340" y1="30" x2="340" y2="290" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.5" class="crit"/>
<text x="340" y="22" text-anchor="middle" fill="#00e5ff" font-size="11" font-family="Georgia,serif" opacity="0.7">Re(s) = ½</text>
<circle cx="340" cy="70"  r="5" fill="#ffd700" class="z1"/>
<circle cx="340" cy="105" r="5" fill="#ffd700" class="z2"/>
<circle cx="340" cy="145" r="5" fill="#ffd700" class="z3"/>
<circle cx="340" cy="183" r="5" fill="#ffd700" class="z4"/>
<circle cx="340" cy="220" r="5" fill="#ffd700" class="z5"/>
<circle cx="340" cy="258" r="5" fill="#ffd700" class="z6"/>
<text x="349" y="68"  fill="#ffd700" font-size="9" font-family="monospace" opacity="0.5">14.13</text>
<text x="349" y="103" fill="#ffd700" font-size="9" font-family="monospace" opacity="0.5">21.02</text>
<text x="349" y="143" fill="#ffd700" font-size="9" font-family="monospace" opacity="0.5">25.01</text>
<text x="349" y="181" fill="#ffd700" font-size="9" font-family="monospace" opacity="0.5">30.42</text>
<text x="349" y="218" fill="#ffd700" font-size="9" font-family="monospace" opacity="0.5">32.93</text>
<text x="349" y="256" fill="#ffd700" font-size="9" font-family="monospace" opacity="0.5">37.58</text>
<text x="340" y="155" text-anchor="middle" font-size="88" font-family="Georgia,serif" fill="#ffd700" opacity="0.9">ζ</text>
<text x="340" y="295" text-anchor="middle" font-size="18" font-family="Georgia,serif" fill="#e0e0e0" letter-spacing="6" opacity="0.9">RIEMANN LAB</text>
<text x="340" y="313" text-anchor="middle" font-size="11" font-family="Georgia,serif" fill="#888" letter-spacing="2">hprzeta · Hypothèse de Riemann</text>
</svg>
