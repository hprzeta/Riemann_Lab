<text x="20" y="442" font-size="12" font-weight="700" fill="#333">Principes de l'architecture</text>
<text x="30" y="464" font-size="11" fill="#1a1a1a">• Quatre machines en câble Ethernet sur la box, une en Wi-Fi (poste de travail portable).</text>
<text x="30" y="484" font-size="11" fill="#1a1a1a">• Adresses fixes réservées hors de la plage distribuée automatiquement (DHCP).</text>
<text x="30" y="504" font-size="11" fill="#1a1a1a">• Les noms des machines sont visibles dans tout le réseau local (DNS local de la box).</text>
<text x="30" y="524" font-size="11" fill="#1a1a1a">• Accès distant : un seul point d'entrée, le bastion PC4, par tunnel chiffré WireGuard.</text>
<text x="30" y="544" font-size="11" fill="#1a1a1a">• Le bastion filtre (pare-feu pf) ; les autres machines ne sont pas exposées à Internet.</text>
