<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans">
  <rect x="0" y="0" width="500" height="400" fill="#ffffff"/>
  <text x="250" y="22" text-anchor="middle" font-size="15" font-weight="bold">Contour paramétré γ(t) = e^{it}</text>
  <text x="250" y="40" text-anchor="middle" font-size="11.5">sens positif (anti-horaire)</text>

  <!-- axes -->
  <line x1="60" y1="220" x2="440" y2="220" stroke="#999" stroke-width="1"/>
  <line x1="250" y1="50" x2="250" y2="390" stroke="#999" stroke-width="1"/>

  <!-- cercle -->
  <circle cx="250" cy="220" r="140" fill="none" stroke="#1a4f8a" stroke-width="2.4"/>

  <!-- points marques -->
  <circle cx="390" cy="220" r="5" fill="#c0392b"/>
  <text x="398" y="216" font-size="12" fill="#c0392b">γ(0) = 1</text>

  <circle cx="250" cy="80" r="5" fill="#c0392b"/>
  <text x="258" y="76" font-size="12" fill="#c0392b">γ(π/2) = i</text>

  <circle cx="110" cy="220" r="5" fill="#c0392b"/>
  <text x="60" y="216" font-size="12" fill="#c0392b">γ(π) = −1</text>

  <circle cx="250" cy="360" r="5" fill="#c0392b"/>
  <text x="258" y="378" font-size="12" fill="#c0392b">γ(3π/2) = −i</text>

  <!-- fleche de direction (sens trigo) -->
  <polygon points="349,121 335,122 342,135" fill="#d17a22"/>
  <text x="352" y="110" font-size="12" fill="#d17a22" font-weight="bold">sens positif</text>

  <!-- encadre formule -->
  <rect x="60" y="20" width="0" height="0"/>
  <text x="250" y="392" text-anchor="middle" font-size="11" fill="#555">γ'(t) = i e^{it} ; longueur L(γ) = ∫₀^{2π} |γ'(t)| dt = 2π</text>
</svg>
