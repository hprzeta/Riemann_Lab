<svg viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans">
  <rect x="0" y="0" width="560" height="400" fill="#ffffff"/>
  <text x="280" y="22" text-anchor="middle" font-size="15" font-weight="bold">Théorème des résidus</text>
  <text x="280" y="40" text-anchor="middle" font-size="11.5">le contour ne « voit » que les pôles intérieurs</text>

  <!-- contour -->
  <circle cx="280" cy="215" r="150" fill="none" stroke="#3a8fbf" stroke-width="2.2" stroke-dasharray="7,5"/>

  <!-- poles interieurs (croix rouges) -->
  <g stroke="#c0392b" stroke-width="3">
    <line x1="322" y1="162" x2="338" y2="178"/>
    <line x1="338" y1="162" x2="322" y2="178"/>
  </g>
  <text x="345" y="175" font-size="13" fill="#c0392b" font-weight="bold">z₁</text>

  <g stroke="#c0392b" stroke-width="3">
    <line x1="232" y1="182" x2="248" y2="198"/>
    <line x1="248" y1="182" x2="232" y2="198"/>
  </g>
  <text x="205" y="198" font-size="13" fill="#c0392b" font-weight="bold">z₂</text>

  <g stroke="#c0392b" stroke-width="3">
    <line x1="272" y1="252" x2="288" y2="268"/>
    <line x1="288" y1="252" x2="272" y2="268"/>
  </g>
  <text x="292" y="272" font-size="13" fill="#c0392b" font-weight="bold">z₃</text>

  <!-- pole exterieur (croix grise) -->
  <g stroke="#888" stroke-width="3">
    <line x1="470" y1="100" x2="486" y2="116"/>
    <line x1="486" y1="100" x2="470" y2="116"/>
  </g>
  <text x="405" y="90" font-size="12" fill="#888">hors contour (ignoré)</text>

  <!-- encadre formule -->
  <rect x="30" y="330" width="500" height="50" fill="#eef4fb" stroke="#3a8fbf"/>
  <text x="280" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a4f8a">∮_γ f(z) dz = 2πi ( Res_{z₁} f + Res_{z₂} f + Res_{z₃} f )</text>

  <text x="280" y="60" text-anchor="middle" font-size="11" fill="#555">Seuls z₁, z₂, z₃ (à l'intérieur) contribuent ; le pôle extérieur n'apporte rien.</text>
</svg>
