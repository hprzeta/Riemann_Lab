<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans">
  <rect x="0" y="0" width="500" height="400" fill="#ffffff"/>
  <text x="250" y="24" text-anchor="middle" font-size="15" font-weight="bold">Module et argument de z = 3 + 4i</text>

  <!-- axes -->
  <line x1="30" y1="320" x2="460" y2="320" stroke="#333" stroke-width="1.5"/>
  <line x1="90" y1="380" x2="90" y2="40" stroke="#333" stroke-width="1.5"/>
  <polygon points="460,320 448,315 448,325" fill="#333"/>
  <polygon points="90,40 85,52 95,52" fill="#333"/>
  <text x="440" y="312" font-size="13" font-weight="bold">Re(z)</text>
  <text x="98" y="54" font-size="13" font-weight="bold">Im(z)</text>

  <!-- graduations -->
  <text x="90" y="336" text-anchor="middle" font-size="11">0</text>
  <text x="195" y="336" text-anchor="middle" font-size="11">3</text>
  <line x1="195" y1="316" x2="195" y2="324" stroke="#333"/>
  <text x="70" y="184" text-anchor="end" font-size="11">4</text>
  <line x1="86" y1="180" x2="94" y2="180" stroke="#333"/>

  <!-- projections pointillees -->
  <line x1="195" y1="180" x2="195" y2="320" stroke="#7a2f2f" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="195" y1="180" x2="90" y2="180" stroke="#7a2f2f" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="205" y="255" font-size="12" fill="#7a2f2f">x = 3</text>
  <text x="120" y="172" font-size="12" fill="#7a2f2f">y = 4</text>

  <!-- vecteur -->
  <line x1="90" y1="320" x2="195" y2="180" stroke="#1a4f8a" stroke-width="2.5"/>
  <polygon points="195,180 184,192 200,196" fill="#1a4f8a"/>
  <circle cx="195" cy="180" r="4" fill="#1a4f8a"/>
  <text x="205" y="150" font-size="13" fill="#1a4f8a" font-weight="bold">z = 3+4i</text>

  <!-- module label le long du vecteur -->
  <text x="115" y="238" font-size="13" fill="#1a6b34" font-weight="bold">|z| = r = 5</text>

  <!-- arc angle theta -->
  <path d="M 130 320 A 40 40 0 0 0 105.7 288.3" fill="none" stroke="#c0392b" stroke-width="1.6"/>
  <text x="140" y="300" font-size="13" fill="#c0392b">θ ≈ 53,13°</text>

  <text x="250" y="375" text-anchor="middle" font-size="11" fill="#555">|z| = √(x²+y²) = √(9+16) = 5 ; θ = arg(z) = arctan(4/3) ≈ 0,9273 rad</text>
</svg>
