<svg viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans">
  <rect x="0" y="0" width="560" height="400" fill="#ffffff"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold">Cascade du prolongement analytique de ζ(s)</text>

  <!-- bandes de couleur -->
  <rect x="20" y="40" width="230" height="300" fill="#e8a598" opacity="0.4"/>
  <rect x="250" y="40" width="80" height="300" fill="#8fb8d1" opacity="0.45"/>
  <rect x="330" y="40" width="210" height="300" fill="#8fd19e" opacity="0.4"/>

  <!-- axes -->
  <line x1="20" y1="215" x2="540" y2="215" stroke="#333" stroke-width="1.3"/>
  <line x1="250" y1="40" x2="250" y2="340" stroke="#333" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="330" y1="40" x2="330" y2="340" stroke="#333" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="330" y="356" text-anchor="middle" font-size="11">σ=1</text>
  <text x="250" y="356" text-anchor="middle" font-size="11">σ=0</text>

  <!-- labels bandes -->
  <text x="130" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a2f2f">σ ≤ 0</text>
  <text x="130" y="88" text-anchor="middle" font-size="11" fill="#7a2f2f">via l'équation fonctionnelle</text>
  <text x="130" y="103" text-anchor="middle" font-size="11" fill="#7a2f2f">ξ(s) = ξ(1−s)  (Chapitres 11-12)</text>

  <text x="290" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a4f7a">0&lt;σ≤1</text>
  <text x="290" y="130" text-anchor="middle" font-size="10.5" fill="#1a4f7a">via η(s)</text>
  <text x="290" y="145" text-anchor="middle" font-size="10.5" fill="#1a4f7a">(Chap. 6)</text>

  <text x="435" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a6b34">σ &gt; 1</text>
  <text x="435" y="88" text-anchor="middle" font-size="11" fill="#1a6b34">série de Dirichlet Σ n⁻ˢ</text>
  <text x="435" y="103" text-anchor="middle" font-size="11" fill="#1a6b34">(Chapitre 1)</text>

  <!-- pole en s=1 -->
  <circle cx="330" cy="215" r="6" fill="#d1a23a" stroke="#7a5a1a"/>
  <text x="340" y="211" font-size="11" fill="#7a5a1a">pôle simple s=1</text>

  <!-- fleches montrant la progression -->
  <path d="M 300 250 L 260 250" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 400 250 L 340 250" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#555">Trois briques successives couvrent tout le plan complexe (sauf le pôle s=1) : série → η → équation fonctionnelle.</text>
</svg>
