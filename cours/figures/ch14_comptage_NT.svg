  <text x="280" y="40" text-anchor="middle" font-size="11.5">escalier réel (marches à chaque zéro) vs formule asymptotique</text>

  <!-- axes -->
  <line x1="50" y1="330" x2="540" y2="330" stroke="#333" stroke-width="1.3"/>
