    <line x1="422.7" y1="178.0" x2="453.5" y2="178.0"/>
    <line x1="453.5" y1="178.0" x2="453.5" y2="140.0"/>
    <line x1="453.5" y1="140.0" x2="510.4" y2="140.0"/>
    <line x1="510.4" y1="140.0" x2="510.4" y2="102.0"/>
    <line x1="510.4" y1="102.0" x2="540.0" y2="102.0"/>
  </g>

  <!-- courbe lisse -->
  <polyline points="148.0,330.0 157.8,330.0 167.6,330.0 177.4,328.0 187.2,325.3 197.0,322.4 206.8,319.1 216.6,315.5 226.4,311.6 236.2,307.5 246.0,303.1 255.8,298.4 265.6,293.6 275.4,288.5 285.2,283.2 295.0,277.7 304.8,272.0 314.6,266.1 324.4,260.0 334.2,253.8 344.0,247.4 353.8,240.8 363.6,234.1 373.4,227.2 383.2,220.2 393.0,213.0 402.8,205.7 412.6,198.3 422.4,190.7 432.2,183.1 442.0,175.2 451.8,167.3 461.6,159.2 471.4,151.1 481.2,142.8 491.0,134.4 500.8,125.9 510.6,117.3 520.4,108.6 530.2,99.8 540.0,90.9"
