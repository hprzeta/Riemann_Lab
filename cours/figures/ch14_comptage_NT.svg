  <line x1="360" y1="88" x2="380" y2="88" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="386" y="92" font-size="11">T/(2π)·ln(T/2πe)+7/8</text>

  <text x="280" y="378" text-anchor="middle" font-size="10.5" fill="#555">À T=100 000 : formule SANS « e » → 49 346 au lieu de 138 067</text>
  <text x="280" y="393" text-anchor="middle" font-size="10" fill="#777">(piège documenté du LAB — recalculé via mpmath)</text>
